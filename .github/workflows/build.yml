name: Build Hermes Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  TERMUX_ROOTFS_VERSION: 'v0.118.0'
  TERMUX_ROOTFS_URL: 'https://github.com/termux/termux-app/releases/download/v0.118.0/termux-rootfs-aarch64.tar.gz'

jobs:
  build:
    name: Build APK (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      matrix:
        build_type: [debug, release]
        include:
          - build_type: debug
            gradle_task: assembleDebug
          - build_type: release
            gradle_task: assembleRelease

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r27b
          build-tools-version: '36.0.0'
          cmdline-tools-version: 'latest'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Official Termux Rootfs
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading Termux rootfs from ${{ env.TERMUX_ROOTFS_URL }}"
          curl -L -o app/src/main/assets/termux-rootfs.tar.gz \
            "${{ env.TERMUX_ROOTFS_URL }}"
          echo "Downloaded: $(ls -lh app/src/main/assets/termux-rootfs.tar.gz)"
          echo "SHA256: $(sha256sum app/src/main/assets/termux-rootfs.tar.gz | cut -d' ' -f1)"

      - name: Verify Rootfs Structure
        run: |
          mkdir -p /tmp/verify-rootfs
          tar -tzf app/src/main/assets/termux-rootfs.tar.gz | head -20
          tar -xzf app/src/main/assets/termux-rootfs.tar.gz -C /tmp/verify-rootfs
          echo "Rootfs extracted, checking key directories:"
          ls -la /tmp/verify-rootfs/ | head -20
          echo "Checking for proot:"
          find /tmp/verify-rootfs -name "proot" -type f 2>/dev/null | head -5
          echo "Checking for bin:"
          ls -la /tmp/verify-rootfs/bin/ 2>/dev/null | head -10 || echo "No bin directory"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --stacktrace
        env:
          # Use placeholder for local.properties secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-apk-${{ matrix.build_type }}
          path: app/build/outputs/apk/${{ matrix.build_type }}/*.apk
          retention-days: 30

      - name: Upload Build Info
        run: |
          APK_PATH=$(find app/build/outputs/apk/${{ matrix.build_type }} -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "APK: $APK_PATH"
            echo "Size: $(ls -lh $APK_PATH | awk '{print $5}')"
            echo "SHA256: $(sha256sum $APK_PATH | cut -d' ' -f1)"
          fi

  # Optional: Release job
  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: hermes-apk-debug
          path: artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: hermes-apk-release
          path: artifacts/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}